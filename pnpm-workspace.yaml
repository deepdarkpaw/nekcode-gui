packages:
  - packages/*

# 平铺 node_modules：electron-builder 打包与运行时依赖闭包按 npm 式目录解析。
# 结构类设置放在这里而不是 .npmrc（pnpm 11 起 .npmrc 只读认证与 registry）。
nodeLinker: hoisted

supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
allowBuilds:
  cpu-features: true
  edgedriver: true
  electron: true
  electron-winstaller: true
  esbuild: true
  geckodriver: true
  koffi: true
  msw: true
  node-pty: true
  protobufjs: true
  ssh2: true
  unsafe-pointer: true
