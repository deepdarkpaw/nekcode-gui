name: Setup workspace
description: Install the repository-pinned Node and pnpm, then frozen dependencies
inputs:
  install-dependencies:
    description: Install pnpm and workspace dependencies
    default: "true"
  install-pnpm:
    description: Install pnpm even when skipping the workspace dependency install
    default: "true"
runs:
  using: composite
  steps:
    # pnpm 版本取 package.json 的 packageManager；Node 版本取 .nvmrc（精确版本）。
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      if: inputs.install-pnpm == 'true'
      with:
        run_install: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.install-dependencies == 'true' && 'pnpm' || '' }}
        cache-dependency-path: pnpm-lock.yaml
        package-manager-cache: false
    # 缓存（上面的 setup-node pnpm store 缓存）只省下载：安装步骤在命中缓存时同样执行。
    # --prefer-offline 让 pnpm 优先用 store 里已校验的包，只有缺失时才访问 registry；
    # --frozen-lockfile 保证安装结果与 pnpm-lock.yaml 完全一致，锁文件不同步直接失败。
    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
