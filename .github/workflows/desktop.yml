name: Desktop CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_macos:
        description: 同时打包 macOS（默认只发 Windows：macOS runner 按 10 倍费率计分钟）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  ZCODE_ENV: production
  ZCODE_SKIP_REMOTE_ASSETS: "1"
  # 默认不签名、不做本机身份自动发现。打包 step 之前由「Resolve signing configuration」
  # 按 secret 是否存在覆盖成 true，并在缺证书时明确打日志说明本次产物未签名。
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
  # 安装包的 app-update.yml 指向 GitHub Releases；owner/repo 取本次构建所在仓库，
  # fork 发版时自动指向自己的 Releases，不需要改代码。默认值（deepdarkpaw/nekcode-gui）见
  # packages/desktop/scripts/desktop-product-identity.mjs。
  NEKCODE_UPDATE_OWNER: ${{ github.repository_owner }}
  NEKCODE_UPDATE_REPO: ${{ github.event.repository.name }}

jobs:
  # 静态门禁：只做版本/类型/规则/结构检查，不跑任何测试或浏览器。
  # 测试与打包都从它下面拆了出去（见 tests / browser-checks），checks 不再是最慢的那条。
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 全史检出：版本串的 commitCount 取 git rev-list --count HEAD，浅克隆会恒为 1，
          # 同一天不同 commit 派生相同版本串，updater 漏推更新（见 packages/desktop/scripts/build-metadata.mjs）
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version
        run: node scripts/ci/desktop-release.mjs check-version
      - uses: ./.github/actions/setup-workspace
        id: setup
      - name: Typecheck
        run: pnpm typecheck
      # 门禁是「棘轮」：存量债务收在 .gate-baseline/ 里，只拦截新增违规。
      # 原始真值命令是 pnpm lint / pnpm fmt:check（存量债务会报错，属预期）。
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm gate:lint
      - name: Format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm gate:format
      - name: Architecture
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm architecture:check
      # knip 早已配置却从未进入 CI（上游 code review 报告 §5.2 同样点名这一点）。
      # 既有告警千余条，直接当门禁会立刻变红，因此走 .gate-baseline/knip.json 棘轮：
      # 只对新增的未用导出/类型/文件/依赖失败，允许逐步收紧。见 scripts/ci/gate-ratchet.mjs。
      - name: Unused code and dependencies
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm gate:knip
      # 逐个校验工作流：除 schema 外，action-validator 还会检查 paths/paths-ignore 的
      # glob 能否匹配到仓库文件，新增工作流的触发过滤不会被写错还静默通过。
      - name: Validate workflow syntax
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          for workflow in .github/workflows/*.yml; do
            npx --yes @action-validator/cli "$workflow"
          done

  # 测试车道：原本全部串在 checks 里，一条慢命令就拖住整段门禁。
  # 拆成互不等待的并行 job（fail-fast: false）：一条车道失败不影响其它车道出结果，
  # 每条命令与拆分前的串行命令一一对应（见 scripts/ci/desktop-workflow.test.mjs）。
  tests:
    name: Tests (${{ matrix.lane.id }})
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lane:
          - id: ui
            # 完整 UI 套件，其中已包含原先单跑的
            # src/v4/conversationTurnRenderUnits.test.ts 与 conversationTurnNavigatorPreview.test.ts；
            # 下面的校验步骤在 CI 里证明这一点，而不是靠注释假设。
            commands: |
              pnpm --filter @zcode/ui exec vitest run src
          - id: services
            commands: |
              node --import tsx --test packages/services/test/*.test.ts
          - id: workspace
            # 协议/客户端/服务端/桌面与 shared。ipcSignalFanout 只从 node:test 入口跑，
            # 因此 --dir packages/desktop/src 仍按原有 --exclude 排除它，保持单一覆盖。
            commands: |
              pnpm vitest run --dir packages/client/src
              pnpm vitest run --dir packages/server/src
              pnpm vitest run --dir packages/desktop/src --exclude '**/ipcSignalFanout.test.ts'
              pnpm vitest run packages/desktop/scripts/build-metadata.test.ts scripts/rolling-app-version.test.ts
              node --import tsx --test packages/shared/test/*.test.ts packages/shared/src/node/*.test.ts packages/desktop/src/preload/ipcSignalFanout.test.ts
          - id: scripts-ci
            # scripts/ci 的 freshness 测试会临时改写源文件再恢复；单独一条车道，
            # 避免与其它并行车道互相干扰。
            commands: |
              node --test --test-isolation=none scripts/ci/*.test.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        id: setup
      # 用 vitest list 收集到的文件清单断言完整 UI 套件确实包含那两条曾单跑的定点套件：
      # 有人调整 include/exclude 把覆盖弄丢时，这里立刻失败。
      - name: Verify full UI suite still owns the pinpoint suites
        if: ${{ !cancelled() && matrix.lane.id == 'ui' && steps.setup.outcome == 'success' }}
        run: |
          listing="$RUNNER_TEMP/ui-vitest-files.txt"
          pnpm --filter @zcode/ui exec vitest list src | sed 's/ > .*//' | sort -u > "$listing"
          for suite in \
            src/v4/conversationTurnNavigatorPreview.test.ts \
            src/v4/conversationTurnRenderUnits.test.ts; do
            grep -qxF "$suite" "$listing" ||
              { echo "::error::full UI suite does not collect $suite"; exit 1; }
          done
      - name: Run lane tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: ${{ matrix.lane.commands }}

  # 浏览器冒烟：一次构建 + 一次 Playwright 安装后串行执行。
  # 这些脚本共用端口与浏览器 profile，同一 runner 上并行会互相抢端口，所以串行、不拆矩阵。
  browser-checks:
    name: Browser smoke checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # 显式指定浏览器目录：缓存路径与安装目标必须指向同一处，不依赖 $HOME 下的默认值。
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        id: setup
      # 缓存只省下载：命中后仍然执行 install（浏览器完整性由 Playwright 自己校验）
      # 与全部冒烟脚本，不因为 cache-hit 跳过任何验证步骤。
      - name: Resolve download cache keys
        id: cache-keys
        run: node scripts/ci/ci-cache-keys.mjs
      - name: Restore Playwright browser download cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.cache-keys.outputs.playwright-key }}
      - name: Install browser for remote form checks
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Build desktop renderer for local configuration checks
        run: pnpm --filter @zcode/desktop build:no-runtime-assets
      - name: Remote form browser checks
        run: node scripts/ci/remote-form-smoke.mjs
      - name: Conversation navigator browser checks
        run: node scripts/ci/conversation-navigator-smoke.mjs
      - name: Imported conversation browser checks
        run: node scripts/ci/local-share-context-smoke.mjs
      - name: Local configuration browser checks
        run: node scripts/ci/session-local-errors-smoke.mjs
      - name: Local onboarding browser checks
        run: node scripts/ci/local-onboarding-smoke.mjs
      - name: Model setup without official purchases
        run: node scripts/ci/no-official-purchase-smoke.mjs
      - name: Local preferences without official accounts
        run: node scripts/ci/local-preferences-smoke.mjs
      - name: Startup without official account restoration
        run: node scripts/ci/root-startup-smoke.mjs
      - name: Conversation file browser checks
        run: |
          node scripts/ci/conversation-export-smoke.mjs
          node scripts/ci/conversation-import-smoke.mjs
      # PR 只恢复不写入：可执行的下载物只从 main/tag 作用域（已合并代码）产生。
      - name: Save Playwright browser download cache
        if: ${{ !cancelled() && success() && github.event_name != 'pull_request' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.cache-keys.outputs.playwright-key }}

  remote-assets:
    name: Bundled Linux remote runtime
    # coverage 与资产 producer 没有数据依赖，之前串行等待 checks 白白增加约 9 分钟。
    # 从同一 ref 并行生成真实资产；checks 失败仍打包，release 仍单独等待 checks 成功。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        id: setup
      - name: Resolve download cache keys
        id: cache-keys
        run: node scripts/ci/ci-cache-keys.mjs
      # 只缓存 Node 官方归档（.cache/remote-node）。脚本每次使用都重算 SHA256，
      # 缓存损坏会直接失败可见；生成的 bundled-remote-assets 不缓存，仍由本次源码产出。
      - name: Restore remote Node archive cache
        id: remote-node-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/remote-node
          key: ${{ steps.cache-keys.outputs.remote-node-key }}
      - name: Build remote components from source
        run: pnpm prepare:remote-assets
      - name: Verify native remote runtime
        run: node scripts/ci/remote-assets-smoke.mjs
      - name: Save remote Node archive cache
        if: ${{ !cancelled() && success() && github.event_name != 'pull_request' && steps.remote-node-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/remote-node
          key: ${{ steps.cache-keys.outputs.remote-node-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundled-remote-linux-x64
          path: packages/desktop/bundled-remote-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build:
    name: Build (${{ matrix.target.platform }} ${{ matrix.target.arch }})
    needs: remote-assets
    # 打包只等待 assets 真实产出，不等待 checks 完成，也不看 checks 是否通过：
    # - checks 失败但 assets 成功 -> 继续打包，保留「检查与打包独立」的产品规则；
    # - assets 失败/取消 -> build 跳过，避免各平台各自下载缺失 artifact 制造重复噪声；
    # 不使用 continue-on-error 或 artifact 静默 fallback，跳过状态如实反映 assets 失败。
    if: ${{ !cancelled() && needs.remote-assets.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - platform: win
            runner: windows-2025
            arch: x64
          # Windows arm64：electron-builder 在 x64 runner 上交叉构建；
          # 这是唯一一个 crossArch 目标：arm64 产物无法在 x64 Node/Electron 里加载。
          - platform: win
            runner: windows-2025
            arch: arm64
            crossArch: true
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      ZCODE_TARGET_OS: ${{ matrix.target.platform }}
      ZCODE_TARGET_ARCH: ${{ matrix.target.arch }}
      # 只发正式产品 nekcode；preview 身份仅用于本地开发构建。
      ZCODE_PREVIEW_IDENTITY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        id: setup
      # Electron runtime zip 与 electron-builder 工具链都是纯下载物。缓存键含 OS、
      # runner 架构、目标架构、版本与 Node+pnpm，交叉构建不会串用别的架构的二进制。
      - name: Resolve download cache keys and directories
        id: cache-keys
        run: node scripts/ci/ci-cache-keys.mjs --target-arch "$ZCODE_TARGET_ARCH"
      - name: Restore Electron runtime download cache
        id: electron-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.cache-keys.outputs.electron-dir }}
          key: ${{ steps.cache-keys.outputs.electron-key }}
      - name: Restore electron-builder toolchain download cache
        id: electron-builder-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.cache-keys.outputs.electron-builder-dir }}
          key: ${{ steps.cache-keys.outputs.electron-builder-key }}
      - name: Resolve signing configuration
        shell: bash
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          # 有证书 secret 时才签名；缺 secret 只记录明确提示，产物保持未签名，
          # 不把「没有证书」静默当成「签名成功」，也不因此让打包失败。
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -n "$WINDOWS_CSC_LINK" ] && [ -n "$WINDOWS_CSC_KEY_PASSWORD" ]; then
              {
                echo "CSC_LINK=$WINDOWS_CSC_LINK"
                echo "CSC_KEY_PASSWORD=$WINDOWS_CSC_KEY_PASSWORD"
                echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
              } >> "$GITHUB_ENV"
              echo "::notice::WINDOWS_CSC_LINK 已配置：Windows 产物将签名"
            else
              echo "::notice::未配置 WINDOWS_CSC_LINK / WINDOWS_CSC_KEY_PASSWORD：本次 Windows 产物不签名"
            fi
          elif [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$MACOS_CSC_LINK" ] && [ -n "$MACOS_SIGNING_IDENTITY" ]; then
              {
                echo "CSC_LINK=$MACOS_CSC_LINK"
                echo "CSC_KEY_PASSWORD=$MACOS_CSC_KEY_PASSWORD"
                echo "CSC_NAME=$MACOS_SIGNING_IDENTITY"
                echo "ZCODE_ENABLE_MAC_SIGN=1"
                echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
              } >> "$GITHUB_ENV"
              echo "::notice::macOS 签名证书已配置：产物启用 hardened runtime 签名（electron-builder notarize=false，公证未接入）"
            else
              echo "::notice::未配置 MACOS_CSC_LINK / MACOS_SIGNING_IDENTITY：本次 macOS 产物不签名"
            fi
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bundled-remote-linux-x64
          path: packages/desktop/bundled-remote-assets
      - name: Verify bundled remote components
        run: node scripts/bundle-remote-assets.mjs verify
      - name: Prepare desktop runtime
        run: pnpm prepare:desktop-runtime
      - name: Build workspace and desktop
        run: pnpm build:bootstrap
      - name: Package and verify desktop
        # ELECTRON_BUILDER_CACHE 指到被缓存的那个目录：缓存路径与打包实际读写的路径
        # 由同一个 output 提供，不会一处命中、另一处重新下载。
        env:
          ELECTRON_BUILDER_CACHE: ${{ steps.cache-keys.outputs.electron-builder-dir }}
        run: pnpm bundle:desktop -- --os "$ZCODE_TARGET_OS" --arch "$ZCODE_TARGET_ARCH" --skip-prepare --skip-build
      - name: Packaged startup smoke
        # x64 Windows runner 不能执行 arm64 交叉产物；该目标仍执行原有静态打包校验。
        if: ${{ !matrix.target.crossArch }}
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: node scripts/acceptance/packaged-smoke.mjs
      - name: Collect installers
        run: node scripts/ci/desktop-release.mjs collect "$ZCODE_TARGET_OS" "$ZCODE_TARGET_ARCH"
      # 缓存写入放在打包与收集成功之后：失败的 run 不会把半成品写进缓存。
      - name: Save Electron runtime download cache
        if: ${{ !cancelled() && success() && github.event_name != 'pull_request' && steps.electron-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.cache-keys.outputs.electron-dir }}
          key: ${{ steps.cache-keys.outputs.electron-key }}
      - name: Save electron-builder toolchain download cache
        if: ${{ !cancelled() && success() && github.event_name != 'pull_request' && steps.electron-builder-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.cache-keys.outputs.electron-builder-dir }}
          key: ${{ steps.cache-keys.outputs.electron-builder-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-production-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: dist/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload packaged smoke artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packaged-smoke-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          # 冒烟步骤把 TMPDIR/TMP/TEMP 指向 runner.temp，沙箱只会出现在这里。
          path: ${{ runner.temp }}/nekcode-acceptance-*
          if-no-files-found: warn
          retention-days: 7

  build-macos:
    name: Build (mac ${{ matrix.target.arch }})
    # macOS runner 按 10 倍费率计分钟，默认不打包（发布只需 Windows）。
    # 需要 mac 产物时用 workflow_dispatch 勾选 build_macos。
    if: ${{ !cancelled() && needs.remote-assets.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.build_macos }}
    needs: remote-assets
    strategy:
      fail-fast: false
      matrix:
        target:
          # arm64 与 x64 各自用原生 runner：Apple Silicon 上交叉打 x64 会带上
          # 错误架构的原生预编译产物（node-pty prebuild、bundled 工具链）。
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 120
    env:
      ZCODE_TARGET_OS: mac
      ZCODE_TARGET_ARCH: ${{ matrix.target.arch }}
      ZCODE_PREVIEW_IDENTITY: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        id: setup
      - name: Resolve download cache keys and directories
        id: cache-keys
        run: node scripts/ci/ci-cache-keys.mjs --target-arch "$ZCODE_TARGET_ARCH"
      - name: Restore Electron runtime download cache
        id: electron-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.cache-keys.outputs.electron-dir }}
          key: ${{ steps.cache-keys.outputs.electron-key }}
      - name: Restore electron-builder toolchain download cache
        id: electron-builder-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.cache-keys.outputs.electron-builder-dir }}
          key: ${{ steps.cache-keys.outputs.electron-builder-key }}
      - name: Resolve signing configuration
        shell: bash
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          # 与 win 同一个判定：有证书 secret 才签名，缺 secret 时明确记录未签名产物。
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$MACOS_CSC_LINK" ] && [ -n "$MACOS_SIGNING_IDENTITY" ]; then
              {
                echo "CSC_LINK=$MACOS_CSC_LINK"
                echo "CSC_KEY_PASSWORD=$MACOS_CSC_KEY_PASSWORD"
                echo "CSC_NAME=$MACOS_SIGNING_IDENTITY"
                echo "ZCODE_ENABLE_MAC_SIGN=1"
                echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
              } >> "$GITHUB_ENV"
              echo "::notice::macOS 签名证书已配置：产物启用 hardened runtime 签名（electron-builder notarize=false，公证未接入）"
            else
              echo "::notice::未配置 MACOS_CSC_LINK / MACOS_SIGNING_IDENTITY：本次 macOS 产物不签名"
            fi
          else
            echo "::notice::$RUNNER_OS 产物无代码签名步骤"
          fi
      # 与 win 同样下载 ubuntu 上产出的 Linux x64 远端运行时：
      # 打包链路在 beforePack/afterPack 里无条件校验 bundled-remote-assets。
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bundled-remote-linux-x64
          path: packages/desktop/bundled-remote-assets
      - name: Verify bundled remote components
        run: node scripts/bundle-remote-assets.mjs verify
      - name: Prepare desktop runtime
        run: pnpm prepare:desktop-runtime
      - name: Build workspace and desktop
        run: pnpm build:bootstrap
      - name: Package and verify desktop
        env:
          ELECTRON_BUILDER_CACHE: ${{ steps.cache-keys.outputs.electron-builder-dir }}
        run: pnpm bundle:desktop -- --os mac --arch "$ZCODE_TARGET_ARCH" --skip-prepare --skip-build
      - name: Packaged startup smoke
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          shopt -s nullglob
          apps=(packages/desktop/dist/mac*/nekcode*.app/Contents/MacOS/nekcode*)
          test "${#apps[@]}" -eq 1 || { echo "expected one packaged app, found ${#apps[@]}"; exit 1; }
          node scripts/acceptance/packaged-smoke.mjs --app "${apps[0]}"
      - name: Collect installers
        run: node scripts/ci/desktop-release.mjs collect mac "$ZCODE_TARGET_ARCH"
      - name: Save Electron runtime download cache
        if: ${{ !cancelled() && success() && github.event_name != 'pull_request' && steps.electron-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.cache-keys.outputs.electron-dir }}
          key: ${{ steps.cache-keys.outputs.electron-key }}
      - name: Save electron-builder toolchain download cache
        if: ${{ !cancelled() && success() && github.event_name != 'pull_request' && steps.electron-builder-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.cache-keys.outputs.electron-builder-dir }}
          key: ${{ steps.cache-keys.outputs.electron-builder-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-production-mac-${{ matrix.target.arch }}
          path: dist/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload packaged smoke artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packaged-smoke-mac-${{ matrix.target.arch }}
          # 冒烟步骤把 TMPDIR/TMP/TEMP 指向 runner.temp，沙箱只会出现在这里。
          path: ${{ runner.temp }}/nekcode-acceptance-*
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Release
    # 发布必须等全部必需 lane 成功：静态门禁、四条测试车道、浏览器冒烟、两个平台打包。
    # macOS 打包默认跳过，release 仍要等它（needs），但允许 skipped；
    # 任一必需 job 失败或取消都满足不了这里的 success 判定，绝不 publish。
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && needs.checks.result == 'success' && needs.tests.result == 'success' && needs.browser-checks.result == 'success' && needs.build.result == 'success' && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') }}
    needs: [checks, tests, browser-checks, build, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # assemble/publish 需要仓库里的 `yaml` 依赖来合并并校验 latest*.yml，
      # 因此发布 job 不再跳过依赖安装（此前的 publish 只用 node 内置模块）。
      - uses: ./.github/actions/setup-workspace
      # 每个打包 job 的 artifact 单独落到 dist/artifacts/<artifact-name>/：
      # 同一平台的 x64 与 arm64 各自产出同名 latest.yml / latest-mac.yml，
      # 直接平铺下载会静默覆盖其中一份，arm64 用户将收不到更新。
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: dist/artifacts
      # 安装包平铺到 dist/release-assets，Windows/macOS 的更新元数据按架构合并成一份。
      # electron-updater 按 latest.yml / latest-mac.yml 拉取更新（provider=github），
      # 缺一份就会 ERR_UPDATER_CHANNEL_FILE_NOT_FOUND。
      - name: Assemble release assets
        run: node scripts/ci/desktop-release.mjs assemble
      # 先建草稿并上传全部资产，最后一步才公开（latest.yml 先于用户可见）。
      - name: Verify assets and publish the release
        run: node scripts/ci/desktop-release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
