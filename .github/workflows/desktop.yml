name: Desktop CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  HUSKY: "0"
  ZCODE_ENV: production
  ZCODE_SKIP_REMOTE_ASSETS: "1"
  # 默认不签名、不做本机身份自动发现。打包 step 之前由「Resolve signing configuration」
  # 按 secret 是否存在覆盖成 true，并在缺证书时明确打日志说明本次产物未签名。
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
  # 安装包的 app-update.yml 指向 GitHub Releases；owner/repo 取本次构建所在仓库，
  # fork 发版时自动指向自己的 Releases，不需要改代码。默认值（nekcode/nekcode-gui）见
  # packages/desktop/scripts/desktop-product-identity.mjs。
  NEKCODE_UPDATE_OWNER: ${{ github.repository_owner }}
  NEKCODE_UPDATE_REPO: ${{ github.event.repository.name }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 全史检出：版本串的 commitCount 取 git rev-list --count HEAD，浅克隆会恒为 1，
          # 同一天不同 commit 派生相同版本串，updater 漏推更新（见 packages/desktop/scripts/build-metadata.mjs）
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version
        run: node scripts/ci/desktop-release.mjs check-version
      - uses: ./.github/actions/setup-workspace
        id: setup
      - name: Typecheck
        run: pnpm typecheck
      # 门禁是「棘轮」：存量债务收在 .gate-baseline/ 里，只拦截新增违规。
      # 原始真值命令是 pnpm lint / pnpm fmt:check（存量债务会报错，属预期）。
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm gate:lint
      - name: Format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm gate:format
      - name: Architecture
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm architecture:check
      # knip 早已配置却从未进入 CI（上游 code review 报告 §5.2 同样点名这一点）。
      # 既有告警千余条，直接当门禁会立刻变红，因此走 .gate-baseline/knip.json 棘轮：
      # 只对新增的未用导出/类型/文件/依赖失败，允许逐步收紧。见 scripts/ci/gate-ratchet.mjs。
      - name: Unused code and dependencies
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm gate:knip
      - name: Vitest suites
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # 这批测试用 vitest，覆盖远控分片/重传/ack、adapter 出站响应等回归场景；
        # 此前 CI 只跑了 scripts/ci 与包级 node:test，这些套件一直没进门禁。
        # workspace 包的 exports 指向 src，套件不依赖构建产物，因此放在构建步骤之后、Release tests 之前。
        # UI 留白套件依赖 @ alias 与 SSR JSX，单独使用受控配置；任一命令失败即门禁失败。
        run: |
          pnpm vitest run packages/shared/src/zcode-protocol-v4
          pnpm vitest run --config packages/ui/vitest.holes.config.ts
          pnpm vitest run --config packages/ui/vitest.config.ts packages/ui/src/v4/conversationTurnRenderUnits.test.ts
      - name: Release tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node --test --test-isolation=none scripts/ci/*.test.mjs
      - name: Validate workflow syntax
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npx --yes @action-validator/cli .github/workflows/desktop.yml
      - name: Conversation navigator regressions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm vitest run --config packages/ui/vitest.config.ts packages/ui/src/v4/conversationTurnNavigatorPreview.test.ts
      - name: Install browser for remote form checks
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Remote form browser checks
        run: node scripts/ci/remote-form-smoke.mjs
      - name: Conversation navigator browser checks
        run: node scripts/ci/conversation-navigator-smoke.mjs
      - name: Imported conversation browser checks
        run: node scripts/ci/local-share-context-smoke.mjs
      - name: Self-managed model settings
        run: |
          pnpm --filter @zcode/desktop build:no-runtime-assets
          node scripts/ci/self-managed-models-smoke.mjs
          node scripts/ci/local-context-smoke.mjs
          node scripts/ci/session-local-errors-smoke.mjs
          node scripts/ci/local-onboarding-smoke.mjs
      - name: Model setup without official purchases
        run: node scripts/ci/no-official-purchase-smoke.mjs
      - name: Local preferences without official accounts
        run: node scripts/ci/local-preferences-smoke.mjs
      - name: Startup without official account restoration
        run: |
          node scripts/ci/root-startup-smoke.mjs
      - name: Conversation file browser checks
        run: |
          node scripts/ci/conversation-export-smoke.mjs
          node scripts/ci/conversation-import-smoke.mjs

  remote-assets:
    name: Bundled Linux remote runtime
    # coverage 与资产 producer 没有数据依赖，之前串行等待 checks 白白增加约 9 分钟。
    # 从同一 ref 并行生成真实资产；checks 失败仍打包，release 仍单独等待 checks 成功。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Build remote components from source
        run: pnpm prepare:remote-assets
      - name: Verify native remote runtime
        run: node scripts/ci/remote-assets-smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundled-remote-linux-x64
          path: packages/desktop/bundled-remote-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build:
    name: Build (${{ matrix.flavor }} ${{ matrix.target.platform }} ${{ matrix.target.arch }})
    needs: remote-assets
    # 打包只等待 assets 真实产出，不等待 checks 完成，也不看 checks 是否通过：
    # - checks 失败但 assets 成功 -> 继续打包，保留「检查与打包独立」的产品规则；
    # - assets 失败/取消 -> build 跳过，避免四个平台各自下载缺失 artifact 制造重复噪声；
    # 不使用 continue-on-error 或 artifact 静默 fallback，跳过状态如实反映 assets 失败。
    if: ${{ !cancelled() && needs.remote-assets.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')) && '["production","preview"]' || '["production"]') }}
        target:
          - platform: linux
            runner: ubuntu-24.04
            arch: x64
          # Linux arm64：使用 GitHub 公共仓库免费提供的原生 arm64 runner，
          # 这样打包后的 Electron 运行时能真正执行探针，而不是只能校验文件。
          - platform: linux
            runner: ubuntu-24.04-arm
            arch: arm64
          - platform: win
            runner: windows-2025
            arch: x64
          # Windows arm64：electron-builder 在 x64 runner 上交叉构建；
          # 这是唯一一个 crossArch 目标：arm64 产物无法在 x64 Node/Electron 里加载。
          - platform: win
            runner: windows-2025
            arch: arm64
            crossArch: true
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      ZCODE_TARGET_OS: ${{ matrix.target.platform }}
      ZCODE_TARGET_ARCH: ${{ matrix.target.arch }}
      ZCODE_PREVIEW_IDENTITY: ${{ matrix.flavor == 'preview' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools zstd
      - uses: ./.github/actions/setup-workspace
      - name: Resolve signing configuration
        shell: bash
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          # 有证书 secret 时才签名；缺 secret 只记录明确提示，产物保持未签名，
          # 不把「没有证书」静默当成「签名成功」，也不因此让打包失败。
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -n "$WINDOWS_CSC_LINK" ] && [ -n "$WINDOWS_CSC_KEY_PASSWORD" ]; then
              {
                echo "CSC_LINK=$WINDOWS_CSC_LINK"
                echo "CSC_KEY_PASSWORD=$WINDOWS_CSC_KEY_PASSWORD"
                echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
              } >> "$GITHUB_ENV"
              echo "::notice::WINDOWS_CSC_LINK 已配置：Windows 产物将签名"
            else
              echo "::notice::未配置 WINDOWS_CSC_LINK / WINDOWS_CSC_KEY_PASSWORD：本次 Windows 产物不签名"
            fi
          elif [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$MACOS_CSC_LINK" ] && [ -n "$MACOS_SIGNING_IDENTITY" ]; then
              {
                echo "CSC_LINK=$MACOS_CSC_LINK"
                echo "CSC_KEY_PASSWORD=$MACOS_CSC_KEY_PASSWORD"
                echo "CSC_NAME=$MACOS_SIGNING_IDENTITY"
                echo "ZCODE_ENABLE_MAC_SIGN=1"
                echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
              } >> "$GITHUB_ENV"
              echo "::notice::macOS 签名证书已配置：产物启用 hardened runtime 签名（electron-builder notarize=false，公证未接入）"
            else
              echo "::notice::未配置 MACOS_CSC_LINK / MACOS_SIGNING_IDENTITY：本次 macOS 产物不签名"
            fi
          else
            echo "::notice::Linux 产物无代码签名步骤：AppImage/deb/rpm/pacman 不签名"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bundled-remote-linux-x64
          path: packages/desktop/bundled-remote-assets
      - name: Verify bundled remote components
        run: node scripts/bundle-remote-assets.mjs verify
      - name: Prepare desktop runtime
        run: pnpm prepare:desktop-runtime
      - name: Build workspace and desktop
        run: pnpm build:bootstrap
      - name: Package and verify desktop
        run: pnpm bundle:desktop -- --os "$ZCODE_TARGET_OS" --arch "$ZCODE_TARGET_ARCH" --skip-prepare --skip-build
      - name: Packaged startup smoke
        # x64 Windows runner 不能执行 arm64 交叉产物；该目标仍执行原有静态打包校验。
        if: ${{ !matrix.target.crossArch }}
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a node scripts/acceptance/packaged-smoke.mjs
          else
            node scripts/acceptance/packaged-smoke.mjs
          fi
      - name: Collect installers
        run: node scripts/ci/desktop-release.mjs collect "$ZCODE_TARGET_OS" "$ZCODE_TARGET_ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.flavor }}-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: dist/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload packaged smoke artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packaged-smoke-${{ matrix.flavor }}-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: |
            /tmp/nekcode-acceptance-*
            ${{ runner.temp }}/nekcode-acceptance-*
          if-no-files-found: warn
          retention-days: 7

  build-macos:
    name: Build (${{ matrix.flavor }} mac ${{ matrix.target.arch }})
    # macOS runner 按 10 倍费率计分钟，只在发版 tag 与手动触发时打包；
    # 日常 push/PR 的打包回归由 linux/win 矩阵与 checks 覆盖。
    if: ${{ !cancelled() && needs.remote-assets.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')) }}
    needs: remote-assets
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')) && '["production","preview"]' || '["production"]') }}
        target:
          # arm64 与 x64 各自用原生 runner：Apple Silicon 上交叉打 x64 会带上
          # 错误架构的原生预编译产物（node-pty prebuild、bundled 工具链）。
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 120
    env:
      ZCODE_TARGET_OS: mac
      ZCODE_TARGET_ARCH: ${{ matrix.target.arch }}
      ZCODE_PREVIEW_IDENTITY: ${{ matrix.flavor == 'preview' && '1' || '0' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Resolve signing configuration
        shell: bash
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          # 与 linux/win 同一个判定：有证书 secret 才签名，缺 secret 时明确记录未签名产物。
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$MACOS_CSC_LINK" ] && [ -n "$MACOS_SIGNING_IDENTITY" ]; then
              {
                echo "CSC_LINK=$MACOS_CSC_LINK"
                echo "CSC_KEY_PASSWORD=$MACOS_CSC_KEY_PASSWORD"
                echo "CSC_NAME=$MACOS_SIGNING_IDENTITY"
                echo "ZCODE_ENABLE_MAC_SIGN=1"
                echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
              } >> "$GITHUB_ENV"
              echo "::notice::macOS 签名证书已配置：产物启用 hardened runtime 签名（electron-builder notarize=false，公证未接入）"
            else
              echo "::notice::未配置 MACOS_CSC_LINK / MACOS_SIGNING_IDENTITY：本次 macOS 产物不签名"
            fi
          else
            echo "::notice::$RUNNER_OS 产物无代码签名步骤"
          fi
      # 与 linux/win 同样下载 ubuntu 上产出的 Linux x64 远端运行时：
      # 打包链路在 beforePack/afterPack 里无条件校验 bundled-remote-assets。
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bundled-remote-linux-x64
          path: packages/desktop/bundled-remote-assets
      - name: Verify bundled remote components
        run: node scripts/bundle-remote-assets.mjs verify
      - name: Prepare desktop runtime
        run: pnpm prepare:desktop-runtime
      - name: Build workspace and desktop
        run: pnpm build:bootstrap
      - name: Package and verify desktop
        run: pnpm bundle:desktop -- --os mac --arch "$ZCODE_TARGET_ARCH" --skip-prepare --skip-build
      - name: Packaged startup smoke
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          shopt -s nullglob
          apps=(packages/desktop/dist/mac*/nekcode*.app/Contents/MacOS/nekcode*)
          test "${#apps[@]}" -eq 1 || { echo "expected one packaged app, found ${#apps[@]}"; exit 1; }
          node scripts/acceptance/packaged-smoke.mjs --app "${apps[0]}"
      - name: Collect installers
        run: node scripts/ci/desktop-release.mjs collect mac "$ZCODE_TARGET_ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.flavor }}-mac-${{ matrix.target.arch }}
          path: dist/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload packaged smoke artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packaged-smoke-${{ matrix.flavor }}-mac-${{ matrix.target.arch }}
          path: |
            /tmp/nekcode-acceptance-*
            ${{ runner.temp }}/nekcode-acceptance-*
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Draft release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [checks, build, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # assemble/publish 需要仓库里的 `yaml` 依赖来合并并校验 latest*.yml，
      # 因此发布 job 不再跳过依赖安装（此前的 publish 只用 node 内置模块）。
      - uses: ./.github/actions/setup-workspace
      # 每个打包 job 的 artifact 单独落到 dist/artifacts/<artifact-name>/：
      # 同一平台的 x64 与 arm64 各自产出同名 latest.yml / latest-mac.yml，
      # 直接平铺下载会静默覆盖其中一份，arm64 用户将收不到更新。
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: dist/artifacts
      # 安装包平铺到 dist/release-assets，Windows/macOS 的更新元数据按架构合并成一份。
      # electron-updater 按 latest.yml / latest-linux.yml / latest-linux-arm64.yml /
      # latest-mac.yml 拉取更新（provider=github），缺一份就会 ERR_UPDATER_CHANNEL_FILE_NOT_FOUND。
      - name: Assemble release assets
        run: node scripts/ci/desktop-release.mjs assemble
      - name: Verify assets and create or update draft
        run: node scripts/ci/desktop-release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
